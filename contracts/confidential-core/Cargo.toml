[package]
name = "confidential-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.1", features = ["legacy"] }
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
near-verifier = { path = "../../crates/near-verifier" }
confidential-crypto = { path = "../../crates/confidential-crypto", default-features = false }
authenticated-book = { path = "../../crates/authenticated-book" }

[features]
unit-testing = ["near-sdk/unit-testing"]

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
