[package]
name = "verifier-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
near-verifier = { path = "../../crates/near-verifier" }
confidential-crypto = { path = "../../crates/confidential-crypto", default-features = false }
ark-bn254 = { version = "0.5", default-features = false }
ark-ed-on-bn254 = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
hex.workspace = true
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

