[workspace]
members = ["crates/*", "contracts/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
near-sdk = "=5.30.1"
borsh = { version = "1.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
overflow-checks = true
strip = "debuginfo"

[profile.prover]
inherits = "release"
opt-level = 3
codegen-units = 8
lto = "thin"

